apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  push:
    branches:
      - "**"
jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world"
  testing:
    steps:
      - name: test project
        kind: build
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: GO
          results-path: /publish-test-results/go
